[workspace]
changelog_config = "cliff.toml"
repo_url = "https://github.com/inmzhang/qrab"
# The release job publishes whenever the manifest version is not yet on the
# registry, rather than only from a release-PR merge. Merging a release PR still
# publishes, but the first version cannot arrive that way: release-plz opens no
# PR when the version already matches what it would release, so the two halves
# would wait on each other forever.
release_always = true
git_release_enable = false
git_tag_name = "v{{ version }}"

# Both are `publish = false` in their own Cargo.toml, and release-plz rejects a
# package whose manifest and configuration disagree, so the flag is repeated
# here rather than left at its default.
[[package]]
name = "xtask"
release = false
publish = false

[[package]]
name = "qrab-playground"
release = false
publish = false
