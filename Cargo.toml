[package]
name = "qrab"
version = "0.1.3"
edition = "2024"
description = "A readable quantum-circuit compiler for TikZ, Typst, SVG, and Quirk"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/qrab"
repository = "https://github.com/inmzhang/qrab"
homepage = "https://github.com/inmzhang/qrab"
rust-version = "1.95"
keywords = ["quantum", "circuit", "typst", "compiler", "quirk"]
categories = ["command-line-utilities", "science", "visualization"]
exclude = [
    "tests/qpic/**",
    "!tests/qpic/permute.qrab",
    "!tests/qpic/QFT4vert.qrab",
    "!tests/qpic/start_and_end.qrab",
    "!tests/qpic/ShorNutshell.qrab",
    "tests/qpic-manual/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
logos = "0.16.1"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
quick-xml = "0.42.0"

[workspace]
members = ["playground", "xtask"]
default-members = ["."]
resolver = "3"

# Shared with the workspace members through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
