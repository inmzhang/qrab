[package]
name = "qrab"
version = "0.1.0"
edition = "2024"
description = "A readable quantum-circuit compiler for TikZ and Typst"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/qrab"
repository = "https://github.com/inmzhang/qrab"
rust-version = "1.95"
keywords = ["quantum", "circuit", "tikz", "typst", "compiler"]
categories = ["command-line-utilities", "science", "visualization"]
exclude = [
    "tests/qpic/**",
    "!tests/qpic/permute.qrab",
    "!tests/qpic/QFT4vert.qrab",
    "!tests/qpic/start_and_end.qrab",
    "!tests/qpic/ShorNutshell.qrab",
    "tests/qpic-manual/**",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
logos = "0.16.1"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
