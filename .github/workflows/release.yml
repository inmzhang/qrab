name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Verify tag matches crate version
        run: |
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build release
        run: cargo build --release --locked --message-format=json-render-diagnostics > target/release-build.json
      - name: Package binary
        run: |
          archive="qrab-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          stage="${archive%.tar.gz}"
          package_id="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].id')"
          out_dir="$(jq -r --arg id "${package_id}" 'select(.reason == "build-script-executed" and .package_id == $id) | .out_dir' target/release-build.json)"
          test -n "${out_dir}"
          assets="${out_dir}/assets"
          test -d "${assets}"
          mkdir -p "${stage}/completions" "${stage}/man"
          install -m 0755 target/release/qrab "${stage}/qrab"
          install -m 0644 "${assets}"/{qrab.bash,qrab.elv,qrab.fish,_qrab,_qrab.ps1} "${stage}/completions/"
          install -m 0644 "${assets}"/*.1 "${stage}/man/"
          tar -czf "${archive}" "${stage}"
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            qrab-*.tar.gz
            qrab-*.tar.gz.sha256
