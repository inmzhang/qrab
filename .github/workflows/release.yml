name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Verify tag matches crate version
        run: |
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: cargo build --release --locked
      - name: Package binary
        run: |
          archive="qrab-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          stage="${archive%.tar.gz}"
          assets="$(find target/release/build -type d -path '*/out/assets' -print -quit)"
          test -n "${assets}"
          mkdir -p "${stage}/completions" "${stage}/man"
          install -m 0755 target/release/qrab "${stage}/qrab"
          install -m 0644 "${assets}"/{qrab.bash,qrab.elv,qrab.fish,_qrab,_qrab.ps1} "${stage}/completions/"
          install -m 0644 "${assets}/qrab.1" "${stage}/man/qrab.1"
          tar -czf "${archive}" "${stage}"
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            qrab-*.tar.gz
            qrab-*.tar.gz.sha256
